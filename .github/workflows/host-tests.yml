name: Firmware Quality

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'test/**'
      - 'platformio.ini'
      - '.github/workflows/host-tests.yml'
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parser-tests:
    name: parser-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run parser tests with ASan/UBSan
        run: make -C test/host

  static-analysis:
    name: static-analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck
      - name: Analyze the canonical Rev C profile
        run: |
          cppcheck --enable=warning --inline-suppr \
            --suppress=missingInclude --suppress=missingIncludeSystem \
            --std=c++11 -DBOARD_SKYSWEEP32_REV_C -DPROFILE_PASSIVE_MONITOR \
            -I src -I src/drivers -I src/protocols --error-exitcode=1 src
