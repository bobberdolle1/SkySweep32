name: Firmware CI

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'boards/skysweep32_rev_c.json'
      - 'platformio.ini'
      - 'tools/development/**'
      - '.github/workflows/platformio.yml'
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-rev-c:
    name: build-rev-c
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Verify generated firmware contracts
        run: |
          python tools/development/generate_rev_c_pinmap.py --check
          python tools/development/generate_dashboard.py --check
      - name: Build canonical Rev C firmware
        run: pio run -e esp32s3_rev_c_passive
