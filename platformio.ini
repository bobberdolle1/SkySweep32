[platformio]
default_envs = esp32s3_rev_c_passive

[env]
; Arduino-ESP32 2.0.x / ESP-IDF 4.4 APIs are the supported firmware baseline.
; The 6.x constraint avoids an unreviewed jump to Arduino-ESP32 3.x.
platform = espressif32 @ ^6.9.0
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder
board_build.partitions = huge_app.csv

lib_deps =
    olikraus/U8g2@^2.35.9
    SPI
    Wire
    bblanchon/ArduinoJson@^7.0.4
    https://github.com/me-no-dev/ESPAsyncWebServer.git
    https://github.com/me-no-dev/AsyncTCP.git
    mikalhart/TinyGPSPlus@^1.0.3
    jgromes/RadioLib@^6.6.0

[env:esp32s3_rev_c_passive]
; Canonical SkySweep32 product target. The pre-build gate validates the reviewed
; Rev C manifest and the generated dashboard/pin contract before compilation.
board = skysweep32_rev_c
extra_scripts = pre:tools/development/pio_rev_c_manifest.py
